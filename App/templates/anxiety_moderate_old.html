<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;1,100&display=swap" rel="stylesheet">
    <style>

    body {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      height: 100vh;

    }

    .container{
        width: 100%;
        height: auto;
        display:flex
    }

    .split {
        height: 100%;
        width: 50%;
        position: fixed;
        z-index: 1;
        top: 0;
        overflow-x: hidden;
        box-sizing: border-box;
    }

    .center {
        /*position: absolute;*/

        right: 13%;
        color:#ffffff;
        text-align: left;
        font-family: 'Inter Tight', sans-serif;

    }

    .rcorners1 {
        top: 80;
        left: 100;
        font-family: 'Inter Tight', sans-serif;
        border-radius: 25px;
        width: 500px;
        background: #ffffff;
        padding: 20px;
        text-align: left;
        color:#4F6D7A

    }

    .left{

        background: #ffffff;
        font-family: 'Inter Tight', sans-serif;
        color:#4F6D7A;
        padding-left: 10%;
        padding-right: 10%;
        padding-top: 5%;
        border-radius: 25px;
    }

    .right {
        right: 0;
        background-color:#4F6D7A;
        padding: 20px;
    }

    .highlight {
        font-weight: bold;
    }

    h1 {
        font-size:35px;
        font-weight: normal;
    }

    h2 {
        font-size:15px;
        font-weight: normal;
    }

    form  { display: table; padding-top: 130px; padding-bottom: 130px;}
    p     { display: table-row;  }
    label { display: table-cell; }
    input { display: table-cell; padding: 10px; margin: 10px; border: 10px; color:#4F6D7A; border-radius: 4px;}

    </style>
</head>

<body>
    <div class="container">
        <div class="split left">
            <h1>
                Welcome to the <span class="highlight">Depression Anxiety Stress Scales (DASS)</span> prediction interactive webpage.
            </h1>

            <h2>
                This applet computes an individual's <span class="highlight">likelihood of moderate anxiety</span>. Based on 6 questions, this app uses a machine learning model to compute the likelihood of anxiety.
            </h2>

        </div>

        <div class="split right">
            <form action="/results_anxiety_moderate" class="center" method="post">

                <label> <b>Please enter your answers below:</b> </label><br><br>
                <p>
                    <label for="Gender">Gender: </label>
                    <select id="lname" name="Gender" step="any" required>
                        <option value="2">Female</option>
                        <option value="1">Male</option>
                    </select>
                </p>
                <p>
                    <label for="Region">Region: </label>
                    <select id="lname" name="Region" step="any" required>
                        <option value="0">East</option>
                        <option value="2">West</option>
                <option value="1">Other</option>
                    </select>
                </p>
                <p>
                    <label for="Age">Age: </label>
                    <input type="number" id="fname" name="Age" value="40" min="18" max="100" step="any" required>
                </p>

                <p>
                <label for="Q9">I found myself in situations that made me so anxious I was most
                relieved when they ended </label>
                <select id="lname" name="Q9" step="any" required>
                <option value="1">Did not apply to me at all</option>
                <option value="2">Applied to me to some degree, or some of the time</option>
                <option value="3">Applied to me to a considerable degree, or a good part of time</option>
                <option value="4">Applied to me very much, or most of the time</option>
                </select>
                </p>
                <br>
                <p>
                <label for="Q11">I found myself getting upset rather easily </label>
                <select id="lname" name="Q11" step="any" required>
                <option value="1">Did not apply to me at all</option>
                <option value="2">Applied to me to some degree, or some of the time</option>
                <option value="3">Applied to me to a considerable degree, or a good part of time</option>
                <option value="4">Applied to me very much, or most of the time</option>
                </select>
                </p>
                <br>
                <p>
                <label for="Q20">I felt scared without any good reason </label>
                <select id="lname" name="Q20" step="any" required>
                <option value="1">Did not apply to me at all</option>
                <option value="2">Applied to me to some degree, or some of the time</option>
                <option value="3">Applied to me to a considerable degree, or a good part of time</option>
                <option value="4">Applied to me very much, or most of the time</option>
                </select>
                </p>
                <br>
                <p>
                <label for="Q30">I feared that I would be "thrown" by some trivial but
                unfamiliar task</label>
                <select id="lname" name="Q30" step="any" required>
                <option value="1">Did not apply to me at all</option>
                <option value="2">Applied to me to some degree, or some of the time</option>
                <option value="3">Applied to me to a considerable degree, or a good part of time</option>
                <option value="4">Applied to me very much, or most of the time</option>
                </select>
                </p>
                <br>
                <p>
                <label for="Q36">I felt terrified </label>
                <select id="lname" name="Q36" step="any" required>
                <option value="1">Did not apply to me at all</option>
                <option value="2">Applied to me to some degree, or some of the time</option>
                <option value="3">Applied to me to a considerable degree, or a good part of time</option>
                <option value="4">Applied to me very much, or most of the time</option>
                </select>
                </p>
                <br>
                <p>
                <label for="Q40">I was worried about situations in which I might panic and make
                a fool of myself </label>
                <select id="lname" name="Q40" step="any" required>
                <option value="1">Did not apply to me at all</option>
                <option value="2">Applied to me to some degree, or some of the time</option>
                <option value="3">Applied to me to a considerable degree, or a good part of time</option>
                <option value="4">Applied to me very much, or most of the time</option>
                </select>
                </p>
                <input type="submit" name= "form" value="Submit" />

            </form>
        </div>
    </div>
</body>
