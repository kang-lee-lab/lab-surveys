<html lang="en">
<head>

</head>

<body>
<nav class="navbar sticky-top navbar-expand-lg bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Kang Lee Development Surveys</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="test_index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="#">Surveys</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://www.kangleelab.com/" target="_blank">Lab Website
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="participate.html">participate
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container px-5 py-5">

    <div class="card">
        <div class="card-body">
            <h4>Please enter your answers below:</h4>
            <div id="carouselExample" class="carousel carousel-dark slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="row py-2">
                            <div class="col">
                                <div class="form-outline">
                                    <label class="form-label" for="typeNumber">Age:</label>
                                    <input type="number" id="typeNumber" class="form-control" placeholder="5"/>
                                </div>
                            </div>

                            <div class="col">
                                <label for="gender" class="form-label">Gender:</label>
                                <select class="form-select" aria-label="Default select example" id="gender">
                                    <option selected>Click to Drop Down</option>
                                    <option value="1">Male</option>
                                    <option value="2">Female</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <p>hey</p>
                    </div>
                    <div class="carousel-item">
                        <p>hey</p>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"

</body>
</html>
