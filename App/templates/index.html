<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;1,100&display=swap" rel="stylesheet">
    <style>

    body {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      height: 100vh;
      
    }

    .split {
        height: 100%;
        width: 50%;
        position: fixed;
        z-index: 1;
        top: 0;
        overflow-x: hidden;
        box-sizing: border-box;
        font-family: 'Inter Tight', sans-serif;
        text-align: left;
    }

    .center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 500px;
        transform: translate(-50%, -50%);
       
    }
    
    .relative {
        position: relative;
        right: 0px;

    }

    .right {
        right: 0;
        color:#ffffff;
        background-color:#4F6D7A;
    }

    .left {
        padding-top: 300px;
        border-top: 300px;
        left: 0;
        color:#4F6D7A;
        overflow: auto;
    }

    .highlight {
        font-weight: bold;
    }

    h1 {
        font-size:55px;
        font-weight: normal;
    }

    h2 {
        font-size:15px;
        font-weight: normal;
    }

    </style>
</head>

<body>
    <div class="split left">
        <div class="center">
            <h1>
                Surveys for Kang Lee Development Lab
            </h1>
            <h2>
               Please select a survey.
            </h2>
        </div>
    </div>

    <div class="split right">
        <div class="center">
            <form action="/asq" class="center" method="post">
                <input type="submit" name= "form" value="ASQ" />
                <h2>
                    Average Stress Quotient assessment
                </h2>
            </form>
            
            <form action="/nafld" class="center" method="post">
                <input type="submit" name= "form" value="NAFLD" />
                <h2>
                    Non-Alcoholic Fatty Liver Disease assessment
                </h2>
            </form>
        </div>
    </div>
</body>
