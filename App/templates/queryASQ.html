<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;1,100&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <style>
    
    *{
        box-sizing: border-box;
    }
 

    body {
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        
    }

    .split {
        height: 100%;
        width: 50%;
        position: fixed;
        z-index: 1;
        top: 0;
        overflow-x: hidden;
        box-sizing: border-box;
        font-family: 'Inter Tight', sans-serif;
        text-align: left;
    }

    .center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 500px;
        transform: translate(-50%, -50%);
        
    }
    
    .relative {
        position: relative;
        right: 0px;

    }

    .right {
        padding-top: 100px;
        border-top: 100px;
        right: 0;
        color:#ffffff;
        background-color:#4F6D7A;
    }

    .left {
        padding-top: 100px;
        border-top: 100px;
        left: 0;
        color:#4F6D7A;
        overflow: auto;
    }

    .highlight {
        font-weight: bold;
    }

    h1 {
        font-size:55px;
        font-weight: normal;
    }

    h2 {
        font-size:15px;
        font-weight: normal;
    }

    </style>

</head>
<body>
    <div class = "split left col-lg-6">
       
            <table>
                <tr>
                    {% for header in headings %}
                    <th style="padding: 20px">{{ header }}</th>
                    {% endfor %}
                </tr>
                {% for row in data %}
                <tr>
                    {% for cell in row %}
                    <td style="padding: 20px">{{ cell }}</td>
                    {%endfor%}
                </tr>
                {%endfor%}
            </table>
        
    </div>
    <div class = "split right col-lg-6">
        
            {%for response in responses%}
                <p> response {{response[1]}}: </p>
                <table>
                    {%for i in response[0]%}
                        <tr>
                            
                            <td style="padding: 20px">{{ i }}</td>
                            
                        </tr>
                    {%endfor%}
                </table>
            {%endfor%}        
    </div>
</body>
</html>
